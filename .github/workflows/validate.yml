name: Validate Pocket Jazz source and station catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify curated playlist hashes, report and capacity
        run: python scripts/catalog_manifest.py --check
      - name: Unit tests (offline, no radio stream requests)
        run: python -m unittest discover -s tests -v
      - name: Verify firmware source snapshot layout
        run: |
          test -f firmware/PocketJazzRadio/PocketJazzRadioApp.cpp
          test -f firmware/LICENSE
          test -f firmware/SHA256-SOURCES.txt
          test -f firmware/arduino-cli.yaml
          test -f firmware/tools/build.ps1
      - name: Verify frozen firmware source SHA-256 checksums
        run: python scripts/verify_firmware_snapshot.py
      - name: Confirm documentation illustrations and release notes exist
        run: |
          test -f docs/images/radio-preview.png
          test -f docs/images/clock-preview.png
          test -f docs/images/browse-preview.png
          test -f docs/images/diagnostics-preview.png
          test -f docs/images/help-preview.png
          test -f CHANGELOG.md
          test -f docs/INSTALL.md
          test -f docs/USER-GUIDE.md
