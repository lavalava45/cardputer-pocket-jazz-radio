name: Validate Pocket Jazz source and station catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify curated playlist hashes, report and capacity
        run: python scripts/catalog_manifest.py --check
      - name: Unit tests (offline, no radio stream requests)
        run: python -m unittest discover -s tests -v
      - name: Verify firmware source snapshot layout
        run: |
          test -f firmware/PocketJazzRadio/PocketJazzRadioApp.cpp
          test -f firmware/LICENSE
          test -f firmware/SHA256-SOURCES.txt
          test -f firmware/arduino-cli.yaml
          test -f firmware/tools/build.ps1
      - name: Verify frozen firmware source SHA-256 checksums
        run: python scripts/verify_firmware_snapshot.py
      - name: Confirm documentation illustrations and release notes exist
        run: |
          test -f docs/images/radio-preview.png
          test -f docs/images/clock-preview.png
          test -f docs/images/browse-preview.png
          test -f docs/images/diagnostics-preview.png
          test -f docs/images/help-preview.png
          test -f CHANGELOG.md
          test -f docs/INSTALL.md
          test -f docs/QUICK-START.md
          test -f docs/WHY-POCKET-JAZZ.md
          test -f docs/USER-GUIDE.md
          test -f docs/RELEASE-v0.7z11.md
          test -f docs/RELEASE-v0.7z12.md
          test -f docs/RELEASE-v0.7z14.md
          test -f firmware/PocketJazzRadio/AudioSourceProgress.h
          test -f firmware/PocketJazzRadio/NotesResultWorkspace.h
          test -f docs/HARDWARE-ACCEPTANCE.md

  firmware-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Firmware Python and policy regression tests
        run: python -m unittest discover -s firmware/tests -p 'test_*.py' -v
      - name: Configure firmware C++ host suite
        run: cmake -S firmware/tests/pcm -B /tmp/pocketjazz-host -DCMAKE_BUILD_TYPE=Release
      - name: Compile firmware host suite
        run: cmake --build /tmp/pocketjazz-host --parallel 4
      - name: Execute C++ host suite
        run: ctest --test-dir /tmp/pocketjazz-host -C Release --output-on-failure --parallel 4
