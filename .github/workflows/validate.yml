name: Validate station catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify curated playlist hashes, report and capacity
        run: python scripts/catalog_manifest.py --check
      - name: Unit tests (offline, no radio stream requests)
        run: python -m unittest discover -s tests -v
